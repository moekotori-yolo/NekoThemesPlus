name: Validate and package

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Static validation and package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate repository
        shell: pwsh
        run: ./Scripts/Validate-Repository.ps1

      - name: Build distributable package
        shell: pwsh
        run: ./Build-Release.ps1 -SkipUnityTest

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NekoThemesPlus-${{ github.sha }}
          path: |
            Dist/*.tgz
            Dist/*.zip
            Dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  unity-tests:
    name: Unity 2022.3 EditMode tests
    if: >-
      ${{ vars.UNITY_CI_ENABLED == 'true' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Unity EditMode tests
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: .
          unityVersion: 2022.3.42f1
          testMode: EditMode
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          customParameters: -accept-apiupdate

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-test-results-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
